{% extends 'base.html' %}

{% block title %}Driver Console Login — Travel Dost{% endblock %}

{% block content %}
<div class="container py-5 my-4">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="transit-card p-4 p-md-5 bg-white shadow-lg border-0 rounded-4">
                <div class="text-center mb-4">
                    <div class="bg-warning text-dark d-inline-flex align-items-center justify-content-center rounded-4 mb-3 shadow" style="width: 56px; height: 56px;">
                        <i class="fa-solid fa-gauge-high fa-2x"></i>
                    </div>
                    <h4 class="fw-bold m-0 text-dark">Driver Cockpit</h4>
                    <p class="text-secondary small mt-1">Bus Vehicle GPS Telemetry Streamer</p>
                </div>

                <!-- 1-Click Demo Fill for Driver -->
                <div class="p-2 mb-3 rounded-3 bg-light border text-center">
                    <button type="button" class="btn btn-sm btn-outline-warning text-dark rounded-pill px-3 py-1" id="btnDriverDemoFill" style="font-size: 0.75rem;">
                        <i class="fa-solid fa-key me-1"></i> Auto-fill Driver (driver1 / pass123)
                    </button>
                </div>

                <form id="driverLoginForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-secondary">DRIVER USERNAME</label>
                        <input type="text" class="form-control rounded-3 fw-medium" id="driverUsername" placeholder="e.g. driver1" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-secondary">ACCESS PASSWORD</label>
                        <input type="password" class="form-control rounded-3 fw-medium" id="driverPassword" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-transit-amber w-100 py-3 mb-3 shadow" id="btnDriverSubmit">
                        <i class="fa-solid fa-gauge me-2"></i> Launch Driver Cockpit
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
$('#btnDriverDemoFill').on('click', function() {
    $('#driverUsername').val('driver1');
    $('#driverPassword').val('pass123');
    $('#driverLoginForm').submit();
});

$('#driverLoginForm').on('submit', function(e) {
    e.preventDefault();
    const btn = $('#btnDriverSubmit');
    btn.html('<i class="fa-solid fa-spinner fa-spin me-2"></i> Initializing Cockpit...').prop('disabled', true);

    $.ajax({
        url: '/api/auth/login/',
        type: 'POST',
        data: JSON.stringify({
            username: $('#driverUsername').val().trim(),
            password: $('#driverPassword').val().trim(),
            role: 'DRIVER'
        }),
        contentType: 'application/json',
        success: function(res) {
            btn.html('<i class="fa-solid fa-check me-2"></i> Connected!');
            window.location.href = res.redirect_url || '/driver/dashboard/';
        },
        error: function(err) {
            btn.html('<i class="fa-solid fa-gauge me-2"></i> Launch Driver Cockpit').prop('disabled', false);
            alert(err.responseJSON ? err.responseJSON.error : "Invalid driver credentials.");
        }
    });
});
</script>
{% endblock %}
