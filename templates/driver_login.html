{% extends 'base.html' %}

{% block title %}Driver Login — Travel Dost{% endblock %}

{% block content %}
<div class="container py-5 my-4">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card border-0 shadow-lg rounded-4 p-4 bg-white border-top border-4 border-warning">
                <div class="text-center mb-4">
                    <span class="bg-warning text-dark p-3 rounded-circle d-inline-block mb-2">
                        <i class="fa-solid fa-id-card fa-2x"></i>
                    </span>
                    <h4 class="fw-bold">Driver Portal Login</h4>
                    <p class="text-secondary small">Access assigned bus & live GPS transmission</p>
                </div>

                <form id="driverLoginForm">
                    <div class="mb-3">
                        <label class="form-label fw-semibold small">Driver Username</label>
                        <input type="text" class="form-control rounded-3" id="driverUsername" placeholder="e.g. driver1" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-semibold small">Password</label>
                        <input type="password" class="form-control rounded-3" id="driverPassword" placeholder="••••••••" required>
                    </div>

                    <button type="submit" class="btn btn-warning w-100 rounded-pill py-2 fw-bold text-dark mb-3">
                        <i class="fa-solid fa-right-to-bracket me-1"></i> Log In to Driver Dashboard
                    </button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
$('#driverLoginForm').on('submit', function(e) {
    e.preventDefault();
    $.ajax({
        url: '/api/auth/login/',
        type: 'POST',
        data: JSON.stringify({
            username: $('#driverUsername').val(),
            password: $('#driverPassword').val(),
            role: 'DRIVER'
        }),
        contentType: 'application/json',
        success: function(res) {
            window.location.href = res.redirect_url || '/driver/dashboard/';
        },
        error: function(err) {
            alert(err.responseJSON ? err.responseJSON.error : "Invalid driver credentials.");
        }
    });
});
</script>
{% endblock %}
