{% extends 'base.html' %}

{% block title %}Sign In — Travel Dost Hubballi-Dharwad Transit{% endblock %}

{% block content %}
<div class="container py-5 my-3">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="transit-card p-4 p-md-5 bg-white shadow-lg border-0 rounded-4 position-relative overflow-hidden">
                <!-- Transit Logo & Title -->
                <div class="text-center mb-4">
                    <div class="brand-badge text-white d-inline-flex align-items-center justify-content-center rounded-4 mb-3 shadow" style="width: 60px; height: 60px;">
                        <i class="fa-solid fa-bus-simple fa-2x"></i>
                    </div>
                    <h3 class="fw-bold m-0 text-dark">TRAVEL DOST</h3>
                    <div class="d-flex align-items-center justify-content-center gap-2 mt-1">
                        <span class="badge bg-warning text-dark fw-bold rounded-pill small">NWKRTC & BRTS</span>
                        <span class="text-secondary small">• Transit Portal</span>
                    </div>
                </div>

                <!-- One-Click Quick Demo Login Shortcuts -->
                <div class="p-3 mb-4 rounded-4 bg-light border">
                    <div class="d-flex align-items-center justify-content-between mb-2">
                        <span class="small fw-bold text-secondary text-uppercase" style="font-size: 0.7rem; letter-spacing: 0.05em;">
                            <i class="fa-solid fa-key text-warning me-1"></i> 1-CLICK DEMO ACCOUNTS
                        </span>
                        <span class="badge bg-primary small" style="font-size: 0.65rem;">One-Click Fill</span>
                    </div>
                    <div class="d-flex flex-wrap gap-1">
                        <button type="button" class="btn btn-sm btn-outline-primary rounded-pill flex-fill py-1 demo-fill-btn" data-user="user1" data-pass="pass123" style="font-size: 0.75rem;">
                            <i class="fa-solid fa-user me-1"></i> Passenger
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-warning text-dark rounded-pill flex-fill py-1 demo-fill-btn" data-user="driver1" data-pass="pass123" style="font-size: 0.75rem;">
                            <i class="fa-solid fa-gauge me-1"></i> Driver
                        </button>
                        <button type="button" class="btn btn-sm btn-outline-danger rounded-pill flex-fill py-1 demo-fill-btn" data-user="admin" data-pass="admin123" style="font-size: 0.75rem;">
                            <i class="fa-solid fa-shield-halved me-1"></i> Admin
                        </button>
                    </div>
                </div>

                <form id="standaloneLoginForm">
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-secondary">USERNAME</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 rounded-start-3 text-secondary">
                                <i class="fa-solid fa-user"></i>
                            </span>
                            <input type="text" class="form-control rounded-end-3 bg-light border-start-0 ps-0 fw-medium" id="loginUsername" placeholder="Enter username e.g. user1" required autofocus>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold small text-secondary">PASSWORD</label>
                        <div class="input-group">
                            <span class="input-group-text bg-light border-end-0 rounded-start-3 text-secondary">
                                <i class="fa-solid fa-lock"></i>
                            </span>
                            <input type="password" class="form-control rounded-end-3 bg-light border-start-0 ps-0 fw-medium" id="loginPassword" placeholder="Enter password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-transit-primary w-100 py-3 mb-3 shadow" id="btnLoginSubmit">
                        <i class="fa-solid fa-right-to-bracket me-2"></i> Sign In to Portal
                    </button>

                    <div class="text-center small pt-3 border-top border-light">
                        <span class="text-secondary">New passenger?</span> 
                        <a href="{% url 'register' %}" class="fw-bold text-primary text-decoration-none ms-1">Create Account</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
// Demo fill button
$('.demo-fill-btn').on('click', function() {
    $('#loginUsername').val($(this).data('user'));
    $('#loginPassword').val($(this).data('pass'));
    $('#standaloneLoginForm').submit();
});

$('#standaloneLoginForm').on('submit', function(e) {
    e.preventDefault();
    const btn = $('#btnLoginSubmit');
    btn.html('<i class="fa-solid fa-spinner fa-spin me-2"></i> Authenticating...').prop('disabled', true);

    $.ajax({
        url: '/api/auth/login/',
        type: 'POST',
        data: JSON.stringify({
            username: $('#loginUsername').val().trim(),
            password: $('#loginPassword').val().trim()
        }),
        contentType: 'application/json',
        success: function(res) {
            btn.html('<i class="fa-solid fa-check me-2"></i> Success! Redirecting...');
            window.location.href = res.redirect_url || '/dashboard/';
        },
        error: function(err) {
            btn.html('<i class="fa-solid fa-right-to-bracket me-2"></i> Sign In to Portal').prop('disabled', false);
            alert(err.responseJSON ? err.responseJSON.error : "Invalid username or password.");
        }
    });
});
</script>
{% endblock %}
