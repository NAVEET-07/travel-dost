<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login — Travel Dost</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@600;700&display=swap" rel="stylesheet">
    
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0;
            padding: 20px;
        }
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.3);
            max-width: 420px;
            width: 100%;
            padding: 40px 30px;
        }
        .brand-title {
            font-family: 'Outfit', sans-serif;
            color: #0f172a;
            font-weight: 700;
        }
        .btn-primary-custom {
            background-color: #2563eb;
            border: none;
            border-radius: 50px;
            padding: 12px;
            font-weight: 600;
            transition: all 0.3s ease;
        }
        .btn-primary-custom:hover {
            background-color: #1d4ed8;
        }
    </style>
</head>
<body>

    <div class="login-card">
        <div class="text-center mb-4">
            <div class="bg-primary text-white d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 64px; height: 64px;">
                <i class="fa-solid fa-bus fa-2x"></i>
            </div>
            <h3 class="brand-title m-0">TRAVEL DOST</h3>
            <p class="text-muted small mt-1">Please sign in to access your portal</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show extra-small py-2" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close py-2" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form id="standaloneLoginForm">
            <div class="mb-3">
                <label class="form-label fw-semibold small text-secondary">Username</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-user text-muted"></i></span>
                    <input type="text" class="form-control bg-light border-start-0 ps-0" id="loginUsername" placeholder="Enter username" required autofocus>
                </div>
            </div>

            <div class="mb-4">
                <label class="form-label fw-semibold small text-secondary">Password</label>
                <div class="input-group">
                    <span class="input-group-text bg-light border-end-0"><i class="fa-solid fa-lock text-muted"></i></span>
                    <input type="password" class="form-control bg-light border-start-0 ps-0" id="loginPassword" placeholder="Enter password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary btn-primary-custom w-100 text-white shadow-sm mb-3">
                <i class="fa-solid fa-right-to-bracket me-2"></i> Log In
            </button>

            <div class="text-center small mt-3 pt-3 border-top">
                <span class="text-secondary">Don't have an account?</span> 
                <a href="{% url 'register' %}" class="fw-bold text-primary text-decoration-none">Register Account</a>
            </div>
        </form>
    </div>

    <!-- Scripts -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
    $('#standaloneLoginForm').on('submit', function(e) {
        e.preventDefault();
        $.ajax({
            url: '/api/auth/login/',
            type: 'POST',
            data: JSON.stringify({
                username: $('#loginUsername').val(),
                password: $('#loginPassword').val()
            }),
            contentType: 'application/json',
            success: function(res) {
                // Automatically redirect user to their assigned role dashboard (Admin, Driver, or User)
                window.location.href = res.redirect_url || '/dashboard/';
            },
            error: function(err) {
                alert(err.responseJSON ? err.responseJSON.error : "Invalid username or password.");
            }
        });
    });
    </script>
</body>
</html>
